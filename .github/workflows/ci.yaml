name: CI checks

on:
  pull_request:
  push:
    branches:
      - main
      - next
      # fork-only: the `-patched` lines are long-lived branches pushed
      # directly rather than through a PR, so neither trigger above fires
      # on them. Without this the patch sets — which is where all the
      # `unsafe` and all the prover changes live — carry no CI evidence
      # at all. A glob rather than a list, so a new line is covered the
      # day it is cut.
      #
      # Drop this entry when proposing the patch set upstream: it is
      # infrastructure for how this fork is operated, not part of the
      # change being proposed.
      - '*-patched'

jobs:
  download-srs:
    runs-on: ubuntu-latest
    outputs:
      srs-cache-hit: ${{ steps.cache-srs.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore SRS from cache
        id: restore-srs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - name: Download SRS if not cached
        if: steps.restore-srs.outputs.cache-hit != 'true'
        run: |
          mkdir -p zk_stdlib/examples/assets
          curl -L -o zk_stdlib/examples/assets/bls_filecoin_2p19 \
            https://midnight-s3-fileshare-dev-eu-west-1.s3.eu-west-1.amazonaws.com/bls_filecoin_2p19

  test-blstrs:
    if: github.event.pull_request.draft == false
    name: Test blstrs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-curves
          args: --release --all-features

  test-circuits:
    if: github.event.pull_request.draft == false
    name: Test circuits
    runs-on: ubuntu-latest-16-core-x64

    env:
      RUST_BACKTRACE: full
      RUSTFLAGS: --cfg ci_build

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: cargo tree -e features -p midnight-curves
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-circuits
          args: --release

  test-zk-stdlib:
    needs: download-srs
    if: github.event.pull_request.draft == false
    name: Test zk-stdlib
    runs-on: ubuntu-latest-16-core-x64

    env:
      RUST_BACKTRACE: full
      RUSTFLAGS: --cfg ci_build

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Restore SRS from cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release -- --skip serialization
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release --test serialization -- --test-threads=1

  test-vk-consistency:
    needs: download-srs
    if: github.event.pull_request.draft == false
    name: Test VK consistency
    runs-on: ubuntu-latest-16-core-x64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Restore SRS from cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release -- --ignored

      - name: Check for changes in goldenfiles/examples.
        run: |
          if ! git diff --quiet -- zk_stdlib/goldenfiles/examples; then
            echo "Files in zk_stdlib/goldenfiles/examples have changed"
            echo "Run "cargo test --release -- --ignored" locally and commit the changes"
            git diff -- zk_stdlib/goldenfiles/examples
            exit 1
          else
            echo "No changes in goldenfiles/examples"
          fi

  test-proofs:
    if: github.event.pull_request.draft == false
    name: Test proofs
    runs-on: ubuntu-latest
    steps:
      - name: Install libfontconfig1-dev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-proofs
          args: --release

  # fork-only: the optimisations live behind `mmap` and `disk-spill`, and
  # `test-proofs` above runs default features only — so until this job existed,
  # the 46 tests that exist only under `disk-spill` had never run in CI once.
  # Clippy's `--all-features` compiles those paths but executes nothing.
  #
  # The matrix is the same one the local gate uses, for the same reason: a
  # feature that turns an optimisation on must be tested with it on, and the
  # spill arm must be forced, because its own floor (`MIDNIGHT_SPILL_FLOOR_K`,
  # default 18) means a normal test run never reaches it.
  test-proofs-features:
    if: github.event.pull_request.draft == false
    name: Test proofs (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mmap
            features: mmap
            forced: 'false'
          - label: disk-spill
            features: disk-spill
            forced: 'false'
          - label: disk-spill forced at every k
            features: disk-spill
            forced: 'true'
    steps:
      - name: Install libfontconfig1-dev
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install
      - name: Test
        env:
          FEATURES: ${{ matrix.features }}
          FORCED: ${{ matrix.forced }}
        run: |
          if [ "$FORCED" = "true" ]; then
            export MIDNIGHT_SPILL_COSETS=1
            export MIDNIGHT_SPILL_FLOOR_K=0
          fi
          cargo test -p midnight-proofs --release --features "$FEATURES"

  test-aggregator:
    if: github.event.pull_request.draft == false
    name: Test Aggregation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-aggregator
          args: --release --all-features

  doc-links:
    if: github.event.pull_request.draft == false
    name: Intra-doc links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install
      - name: cargo fetch
        run: cargo fetch

      # Ensure intra-documentation links all resolve correctly
      # Requires #![deny(intra_doc_link_resolution_failure)] in crates.
      - name: Check intra-doc links
        run: cargo doc --workspace --document-private-items --no-deps

  fmt:
    if: github.event.pull_request.draft == false
    name: Rustfmt
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # fork-only: pin the formatter.
      #
      # `@nightly` installs whatever nightly exists on the day the job runs,
      # so this check re-decides what "formatted" means every morning. The
      # tree is formatted to roughly nightly-2026-03-08; against a September
      # nightly, `--check` reports diffs in 130+ files across curves/,
      # circuits/, aggregation/ and zk_stdlib/ — nearly all of them untouched
      # by any branch. The job is red for everyone, and the only ways out are
      # to reformat the whole repository or to pin.
      #
      # Pinned rather than reformatted: a patch set that rewrites 130
      # upstream files to chase a formatter is unreviewable, and it would go
      # red again on the next rustfmt change anyway.
      #
      # Worth proposing upstream on its own merits — an unpinned formatter in
      # CI breaks branches that changed nothing.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-08
          components: rustfmt
      - run: cargo +nightly-2026-03-08 fmt --all -- --check

  clippy:
    if: github.event.pull_request.draft == false
    name: Clippy
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install

      # font required for benchmarking charts generation
      - name: Install libfontconfig1-dev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Run Clippy
        if: always()
        run: cargo clippy --all-targets --all-features -- -Dwarnings

      - name: Run Clippy on `aggregator`
        if: always()
        run: cargo clippy -p midnight-aggregator --all-targets --all-features -- -Dwarnings
